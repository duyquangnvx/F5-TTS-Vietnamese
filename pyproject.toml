[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-tts"
version = "1.0.1"
description = "F5-TTS: A Fairytaler that Fakes Fluent and Faithful Speech with Flow Matching"
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.9,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>0.37.0; platform_machine != 'arm64' and platform_system != 'Darwin'",
    "cached_path",
    "click",
    "datasets",
    "ema_pytorch>=0.5.2",
    "gradio>=3.45.2",
    "hydra-core>=1.3.0",
    "jieba",
    "librosa",
    "matplotlib",
    "numpy>=1.24.0,<2.0.0",
    "omegaconf",
    "psutil",
    "pydub",
    "pypinyin",
    "safetensors",
    "soundfile",
    "tomli",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchdiffeq",
    "tqdm>=4.65.0",
    "transformers",
    "transformers_stream_generator",
    "vocos",
    "wandb",
    "x_transformers>=1.31.14",
]

[project.optional-dependencies]
eval = [
    "faster_whisper==0.10.1",
    "funasr",
    "jiwer",
    "modelscope",
    "zhconv",
    "zhon",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/SWivid/F5-TTS"
Repository = "https://github.com/SWivid/F5-TTS"

[project.scripts]
# Main CLI commands (new naming convention)
f5-tts-infer = "f5_tts.infer.infer_cli:main"
f5-tts-gradio = "f5_tts.infer.infer_gradio:main"
f5-tts-train = "f5_tts.train.finetune_cli:main"
f5-tts-train-gradio = "f5_tts.train.finetune_gradio:main"

# Tools CLI commands
f5-tts-prepare-metadata = "f5_tts.tools.prepare_metadata:main"
f5-tts-convert-sr = "f5_tts.tools.convert_sr:main"
f5-tts-check-vocab = "f5_tts.tools.check_vocab:main"
f5-tts-extend-embeddings = "f5_tts.tools.extend_embeddings:main"
f5-tts-check-device = "f5_tts.tools.check_device:main"

# Legacy CLI commands (for backward compatibility during transition)
"f5-tts_infer-cli" = "f5_tts.infer.infer_cli:main"
"f5-tts_infer-gradio" = "f5_tts.infer.infer_gradio:main"
"f5-tts_finetune-cli" = "f5_tts.train.finetune_cli:main"
"f5-tts_finetune-gradio" = "f5_tts.train.finetune_gradio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f5_tts = [
    "configs/*.yaml",
    "infer/examples/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120
